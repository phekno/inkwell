version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - gosec        # security
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    - misspell
    - revive

  settings:
    gosec:
      excludes:
        - G104 # unchecked errors — already covered by errcheck

    # Disable the noisy "every exported symbol must have a doc comment" rules.
    # We add comments where the WHY is non-obvious, not as a matter of policy.
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofumpt
    - goimports
