name: dependency-review

# Blocks PRs that add or bump a dependency with a known high/critical
# vulnerability (npm, Go modules, Actions), before it ever reaches main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
