name: scorecard

# OpenSSF Scorecard: grades the repo's supply-chain hygiene (pinned actions,
# token permissions, branch protection, dependency updates, …). Findings land
# in the Security tab; publish_results feeds the README badge.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '23 8 * * 1' # Monday morning UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
