name: api

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: api/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -race

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: api/go.sum
      - name: Build lambda
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -ldflags='-s -w' -o bootstrap ./cmd/lambda
          zip -q lambda.zip bootstrap
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/inkwell-gh-deploy
          aws-region: us-east-1
      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name inkwell-api \
            --zip-file fileb://lambda.zip \
            --publish
