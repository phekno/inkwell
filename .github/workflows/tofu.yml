name: tofu

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/tofu.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/tofu.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/inkwell-gh-deploy
          aws-region: us-east-1
      - run: tofu fmt -check -recursive
      - name: tofu init
        run: |
          tofu init \
            -backend-config="bucket=inkwell-tf-state-${{ secrets.AWS_ACCOUNT_ID }}"
      - run: tofu validate
      - run: tofu plan -no-color -input=false

  apply:
    if: github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/inkwell-gh-deploy
          aws-region: us-east-1
      - name: tofu init
        run: |
          tofu init \
            -backend-config="bucket=inkwell-tf-state-${{ secrets.AWS_ACCOUNT_ID }}"
      - run: tofu apply -auto-approve -input=false
