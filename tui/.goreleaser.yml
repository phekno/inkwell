version: 2

project_name: inkwell

before:
  hooks:
    - go mod tidy

builds:
  - id: inkwell
    binary: inkwell
    main: ./cmd/inkwell
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

brews:
  - name: inkwell
    repository:
      owner: phekno
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@phekno.com
    commit_msg_template: "brew: bump {{ .ProjectName }} to {{ .Tag }}"
    homepage: https://github.com/phekno/inkwell
    description: "Cloud-backed journaling TUI built on Bubble Tea"
    license: MIT
    install: |
      bin.install "inkwell"
    test: |
      assert_match "inkwell", shell_output("#{bin}/inkwell --version", 0)

release:
  github:
    owner: phekno
    name: inkwell
  draft: false
  prerelease: auto
